<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Habit Tracker System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>Habit Tracker</h1>
                <p>Create an account to start tracking habits</p>
            </div>

            <div id="errorMessage"
                style="color: var(--danger); font-size: 14px; text-align: center; margin-bottom: 15px; font-weight: 500;">
            </div>

            <form id="registerForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="example@gmail.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary">Create Account</button>
            </form>

            <div class="auth-footer">
                <p>Already have an account? <a href="/login">Log In</a></p>
            </div>
        </div>
    </div>

    <script src="/static/js/auth.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            Auth.guardGuestPage();

            document.getElementById("registerForm").addEventListener("submit", async (event) => {
                event.preventDefault();

                const email = document.getElementById("email").value.trim();
                const password = document.getElementById("password").value;
                const confirmPassword = document.getElementById("confirmPassword").value;
                const errorMessage = document.getElementById("errorMessage");

                if (!email || !password || !confirmPassword) {
                    errorMessage.textContent = "Please fill in all fields.";
                    return;
                }

                if (password !== confirmPassword) {
                    errorMessage.textContent = "Passwords do not match.";
                    return;
                }

                try {
                    errorMessage.textContent = "";
                    const response = await fetch("/api/register", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ email, password })
                    });

                    const data = await response.json();

                    if (response.ok) {
                        window.location.href = "/login";
                        return;
                    }

                    errorMessage.textContent = data.error || data.message || "Registration failed.";
                } catch (error) {
                    console.error("Register error:", error);
                    errorMessage.textContent = "Failed to connect to the server.";
                }
            });
        });
    </script>
</body>

</html>
