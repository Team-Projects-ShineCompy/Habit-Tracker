<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Habit Tracker System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>Habit Tracker</h1>
                <p>Create an account to start tracking habits</p>
            </div>

            <div id="errorMessage"
                style="color: var(--danger); font-size: 14px; text-align: center; margin-bottom: 15px; font-weight: 500;">
            </div>

            <form id="registerForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="example@gmail.com" required>
                </div>
                <div id="otpStep" class="remove">
                    <div class="form-group">
                        <label for="otp">Verification Code</label>
                        <input type="text" id="otp" class="form-control" inputmode="numeric" maxlength="6"
                            autocomplete="one-time-code">
                    </div>
                    <button type="button" id="verifyOtp" class="btn btn-primary">Verify Email</button>
                </div>
                <div id="passwordStep" class="remove">
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" class="form-control" placeholder="At least 8 characters">
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password</label>
                        <input type="password" id="confirmPassword" class="form-control"
                            placeholder="Repeat your password">
                    </div>
                    <button type="submit" class="btn btn-primary">Create Account</button>
                </div>
            </form>

            <div class="auth-footer">
                <p>Already have an account? <a href="/login">Log In</a></p>
            </div>
        </div>
    </div>

    <script src="/static/js/auth.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            Auth.guardGuestPage();

            const form = document.getElementById("registerForm");
            const emailInput = document.getElementById("email");
            const errorMessage = document.getElementById("errorMessage");
            form.addEventListener("submit", async (event) => {
                event.preventDefault();
                const email = emailInput.value.trim();
                const password = document.getElementById("password").value;
                const confirmPassword = document.getElementById("confirmPassword").value;
                if (password.length < 8) {
                    errorMessage.textContent = "Password must be at least 8 characters.";
                    return;
                }
                if (password !== confirmPassword) {
                    errorMessage.textContent = "Passwords do not match.";
                    return;
                }
                try {
                    const response = await fetch("/api/auth/signup/create-password", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ email, password })
                    });

                    const data = await response.json();

                    if (response.ok) {
                        window.location.href = "/";
                        return;
                    }

                    errorMessage.textContent = data.error || data.message || "Registration failed.";
                } catch (error) {
                    console.error("Register error:", error);
                    errorMessage.textContent = "Failed to connect to the server.";
                }
            });

            document.getElementById("email").addEventListener("change", () => {
                document.getElementById("otpStep").classList.add("remove");
                document.getElementById("passwordStep").classList.add("remove");
            });
            document.getElementById("email").insertAdjacentHTML("afterend", '<button type="button" id="sendOtp" class="btn btn-secondary">Send Verification Code</button>');
            document.getElementById("sendOtp").addEventListener("click", async () => {
                const response = await fetch("/api/auth/signup/send-otp", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ email: emailInput.value.trim() }) });
                const data = await response.json();
                errorMessage.textContent = data.error || data.message || "";
                if (response.ok) document.getElementById("otpStep").classList.remove("remove");
            });
            document.getElementById("verifyOtp").addEventListener("click", async () => {
                const response = await fetch("/api/auth/signup/verify-otp", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ email: emailInput.value.trim(), otp: document.getElementById("otp").value.trim() }) });
                const data = await response.json();
                errorMessage.textContent = data.error || data.message || "";
                if (response.ok) { document.getElementById("passwordStep").classList.remove("remove"); document.getElementById("otpStep").classList.add("remove"); }
            });
        });
    </script>
</body>

</html>
