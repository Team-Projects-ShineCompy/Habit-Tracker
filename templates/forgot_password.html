<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Habit Tracker System</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>Reset Password</h1>
                <p>Verify your email to choose a new password</p>
            </div>
            <div id="errorMessage"
                style="color: var(--danger); font-size: 14px; text-align: center; margin-bottom: 15px; font-weight: 500;">
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" class="form-control" placeholder="example@gmail.com" required>
            </div>
            <button type="button" id="sendOtp" class="btn btn-secondary">Send Verification Code</button>
            <div id="otpStep" class="remove">
                <div class="form-group" style="margin-top: 20px;">
                    <label for="otp">Verification Code</label>
                    <input type="text" id="otp" class="form-control" inputmode="numeric" maxlength="6"
                        autocomplete="one-time-code">
                </div>
                <button type="button" id="verifyOtp" class="btn btn-primary">Verify Email</button>
            </div>
            <form id="passwordStep" class="remove" style="margin-top: 20px;">
                <div class="form-group"><label for="password">New Password</label><input type="password" id="password"
                        class="form-control" placeholder="At least 8 characters"></div>
                <div class="form-group"><label for="confirmPassword">Confirm Password</label><input type="password"
                        id="confirmPassword" class="form-control"></div>
                <button type="submit" class="btn btn-primary">Update Password</button>
            </form>
            <div class="auth-footer">
                <p><a href="/login">Back to Log In</a></p>
            </div>
        </div>
    </div>
    <script>
        const email = document.getElementById('email');
        const error = document.getElementById('errorMessage');
        async function call(url, body) {
            const response = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
            return { response, data: await response.json() };
        }
        document.getElementById('sendOtp').onclick = async () => {
            try {
                const result = await call('/api/auth/reset/send-otp', { email: email.value.trim() });
                error.textContent = result.data.error || result.data.message || '';
                if (result.response.ok) document.getElementById('otpStep').classList.remove('remove');
            } catch (_) { error.textContent = 'Failed to connect to the server.'; }
        };
        document.getElementById('verifyOtp').onclick = async () => {
            try {
                const result = await call('/api/auth/reset/verify-otp', { email: email.value.trim(), otp: document.getElementById('otp').value.trim() });
                error.textContent = result.data.error || result.data.message || '';
                if (result.response.ok) { document.getElementById('otpStep').classList.add('remove'); document.getElementById('passwordStep').classList.remove('remove'); }
            } catch (_) { error.textContent = 'Failed to connect to the server.'; }
        };
        document.getElementById('passwordStep').onsubmit = async (event) => {
            event.preventDefault();
            const password = document.getElementById('password').value;
            if (password.length < 8) { error.textContent = 'Password must be at least 8 characters.'; return; }
            if (password !== document.getElementById('confirmPassword').value) { error.textContent = 'Passwords do not match.'; return; }
            try {
                const result = await call('/api/auth/reset/new-password', { password });
                error.textContent = result.data.error || result.data.message || '';
                if (result.response.ok) window.location.href = '/login';
            } catch (_) { error.textContent = 'Failed to connect to the server.'; }
        };
    </script>
</body>

</html>
